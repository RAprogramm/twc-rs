name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Allows CodSpeed to trigger backtest performance analysis to generate
  # initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodSpeed is a third-party service: its own outages or API errors must
    # not redden CI or block merges. The job still reports and annotates, but
    # its failure is non-blocking by design.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7 # checkout repository
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable # stable toolchain
      - uses: Swatinem/rust-cache@v2 # shared cargo cache
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Build the benchmark target(s)
        run: cargo codspeed build -m simulation
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
